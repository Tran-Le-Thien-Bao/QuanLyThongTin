<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập — Quản Lý Bệnh Viện</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="login-wrapper">

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ 'danger' if cat in ('error','danger') else cat }} alert-dismissible fade show mb-3"
           style="max-width:400px;width:100%" role="alert">
        <i class="bi {{ 'bi-check-circle' if cat == 'success' else 'bi-exclamation-triangle' }} me-2"></i>
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}

  <div class="login-card text-center">
    <div class="login-logo mb-2">
      <i class="bi bi-hospital-fill"></i>
    </div>
    <div class="login-title fs-4 mb-1">Hệ Thống Quản Lý</div>
    <div class="mb-4" style="color:var(--text-muted);font-size:.88rem">
      Bệnh Viện — IE103.Q22
    </div>

    <form method="POST">
      <div class="mb-3 text-start">
        <label class="form-label">Tài khoản</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" name="tai_khoan" class="form-control"
                 placeholder="Nhập tài khoản..." required autofocus>
        </div>
      </div>
      <div class="mb-4 text-start">
        <label class="form-label">Mật khẩu</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" name="mat_khau" class="form-control"
                 placeholder="Nhập mật khẩu..." required>
        </div>
      </div>
      <button type="submit" class="btn btn-hospital w-100 py-2">
        <i class="bi bi-box-arrow-in-right me-2"></i>Đăng nhập
      </button>
    </form>
  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
